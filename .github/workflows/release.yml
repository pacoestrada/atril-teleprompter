name: Comprobar y publicar versión

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - core.py
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: atril-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar herramientas de pruebas y empaquetado
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 python3-pyqt5.qtmultimedia libqt5multimedia5-plugins ffmpeg rpm desktop-file-utils

      - name: Comprobar la aplicación y su lanzador
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m unittest discover -s tests -v
          python3 atril.py --version
          desktop-file-validate packaging/es.compilando.AtrilTeleprompter.desktop

      - name: Construir fuentes, DEB y RPM
        run: |
          python3 packaging/build_source.py
          python3 packaging/build_deb.py
          python3 packaging/build_rpm.py
          version=$(python3 -c 'from core import VERSION; print(VERSION)')
          dpkg-deb --info "dist/atril-teleprompter_${version}_all.deb"
          rpm -qip "dist/atril-teleprompter-${version}-1.noarch.rpm"
          rpm -qpR "dist/atril-teleprompter-${version}-1.noarch.rpm"

      - name: Construir, instalar y comprobar el paquete de Arch Linux
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/project" -w /project archlinux:base-devel bash -euc '
            pacman -Syu --noconfirm --needed python python-pyqt5 qt5-multimedia ffmpeg desktop-file-utils ttf-dejavu
            useradd -m builder
            install -d -o builder -g builder /tmp/atril-build
            cp packaging/arch/PKGBUILD dist/atril-teleprompter-*.tar.gz /tmp/atril-build/
            chown -R builder:builder /tmp/atril-build
            su builder -c "cd /tmp/atril-build && makepkg --printsrcinfo" > /tmp/SRCINFO
            diff -u packaging/arch/.SRCINFO /tmp/SRCINFO
            su builder -c "cd /tmp/atril-build && makepkg --cleanbuild --noconfirm"
            pacman -U --noconfirm /tmp/atril-build/*.pkg.tar.zst
            su builder -c "bash /project/packaging/arch/check-installed.sh"
            cp /tmp/atril-build/*.pkg.tar.zst /project/dist/
          '
          cp packaging/arch/PKGBUILD dist/
          cp packaging/arch/.SRCINFO dist/SRCINFO
          cp packaging/arch/README.md dist/ARCH-INSTALL.md
          cp docs/atril-vumetro-analogico.png docs/atril-vumetro-analogico.gif dist/
          cd dist
          sha256sum *.deb *.rpm *.pkg.tar.zst *.tar.gz PKGBUILD SRCINFO ARCH-INSTALL.md atril-vumetro-analogico.png atril-vumetro-analogico.gif > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: atril-release-packages
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

      - name: Publicar la release sin sustituir versiones existentes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'from core import VERSION; print(VERSION)')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La release $tag ya existe. No se modifica."
            exit 0
          fi
          title=$(python3 -c 'from pathlib import Path; from core import VERSION; print(Path(f"docs/releases/v{VERSION}.md").read_text().splitlines()[0].removeprefix("# "))')
          gh release create "$tag" dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "$title" \
            --notes-file "docs/releases/$tag.md"
